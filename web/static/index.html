<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>久谦研究智能体 Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body data-mobile-panel="center">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>久谦研究 / RESEARCH</span>
        </div>
      </div>
      <div class="topbar-tools">
        <div class="layout-toggle-group" role="group" aria-label="面板显示控制">
          <button id="toggle-nav-panel-button" class="topbar-icon-button layout-toggle-button" type="button" aria-label="隐藏文件面板" title="隐藏文件面板" aria-pressed="true">
            <svg class="layout-toggle-icon" aria-hidden="true" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="M9 5v14"></path>
              <path d="M15 5v14"></path>
              <rect class="layout-toggle-fill" x="4.75" y="6.75" width="3.5" height="10.5" rx="0.8"></rect>
            </svg>
          </button>
          <button id="toggle-center-panel-button" class="topbar-icon-button layout-toggle-button" type="button" aria-label="隐藏编辑器面板" title="隐藏编辑器面板" aria-pressed="true">
            <svg class="layout-toggle-icon" aria-hidden="true" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="M9 5v14"></path>
              <path d="M15 5v14"></path>
              <rect class="layout-toggle-fill" x="10.25" y="6.75" width="3.5" height="10.5" rx="0.8"></rect>
            </svg>
          </button>
        </div>
        <button class="topbar-icon-button settings-button" type="button" aria-label="设置" title="设置"></button>
        <div class="topbar-avatar" aria-hidden="true">久</div>
      </div>
    </header>

    <div class="page-grid" aria-hidden="true"></div>
    <div class="page-orb orb-left" aria-hidden="true"></div>
    <div class="page-orb orb-right" aria-hidden="true"></div>

    <div id="app-shell" class="app-shell">
      <aside class="nav-panel">
        <div class="nav-tabs" role="tablist" aria-label="工作台导航标签">
          <button id="files-tab-button" class="nav-tab active" type="button" data-tab="files" role="tab" aria-selected="true">文件</button>
          <button id="skills-tab-button" class="nav-tab" type="button" data-tab="skills" role="tab" aria-selected="false">技能</button>
        </div>

        <section id="files-panel" class="nav-section">
          <div class="section-meta">
            <span class="section-title">文件</span>
            <span id="workspace-root-label" class="section-note"></span>
          </div>
          <div class="file-toolbar" role="toolbar" aria-label="文件操作">
            <button id="file-new-file-button" class="file-tool-button" type="button" aria-label="新建文件" title="新建文件">
              <svg class="file-tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
                <path d="M14 2v6h6"></path>
                <path d="M12 11v6"></path>
                <path d="M9 14h6"></path>
              </svg>
            </button>
            <button id="file-new-folder-button" class="file-tool-button" type="button" aria-label="新建文件夹" title="新建文件夹">
              <svg class="file-tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
                <path d="M12 11v6"></path>
                <path d="M9 14h6"></path>
              </svg>
            </button>
            <button id="file-upload-button" class="file-tool-button" type="button" aria-label="上传文件" title="上传文件">
              <svg class="file-tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 16V4"></path>
                <path d="M7 9l5-5 5 5"></path>
                <path d="M5 20h14"></path>
              </svg>
            </button>
            <button id="file-download-button" class="file-tool-button" type="button" disabled aria-label="下载所选文件" title="下载所选文件">
              <svg class="file-tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 4v12"></path>
                <path d="M7 11l5 5 5-5"></path>
                <path d="M5 20h14"></path>
              </svg>
            </button>
            <button id="file-copy-button" class="file-tool-button" type="button" disabled aria-label="复制所选项目" title="复制所选项目">
              <svg class="file-tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <rect x="8" y="8" width="12" height="12" rx="2"></rect>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
              </svg>
            </button>
            <button id="file-paste-button" class="file-tool-button" type="button" disabled aria-label="粘贴已复制项目" title="粘贴已复制项目">
              <svg class="file-tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M8 4h8"></path>
                <path d="M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"></path>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <path d="M12 11v6"></path>
                <path d="M9 14h6"></path>
              </svg>
            </button>
            <button id="file-rename-button" class="file-tool-button" type="button" disabled aria-label="重命名所选项目" title="重命名所选项目">
              <svg class="file-tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
              </svg>
            </button>
            <button id="file-delete-button" class="file-tool-button" type="button" disabled aria-label="删除所选项目" title="删除所选项目">
              <svg class="file-tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3 6h18"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
              </svg>
            </button>
            <button id="file-refresh-button" class="file-tool-button" type="button" aria-label="刷新文件" title="刷新文件">
              <svg class="file-tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"></path>
                <path d="M3 21v-5h5"></path>
                <path d="M3 12A9 9 0 0 1 18.4 5.6L21 8"></path>
                <path d="M21 3v5h-5"></path>
              </svg>
            </button>
            <input id="file-upload-input" type="file" multiple hidden>
          </div>
          <div id="file-tree" class="tree-panel"></div>
        </section>

        <section id="skills-panel" class="nav-section hidden">
          <div class="section-meta">
            <span class="section-title">技能</span>
            <span class="section-note">浏览并为本轮对话附加技能</span>
          </div>
          <div id="skills-list" class="skills-panel"></div>
        </section>
      </aside>

      <div
        id="divider-left"
        class="panel-divider panel-divider-left"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整导航和文档面板大小"
      ></div>

      <main class="center-panel">
        <header class="center-header">
          <div class="center-tabs-row">
            <div class="mobile-controls">
              <button id="show-left-button" class="mobile-button" type="button">文件</button>
              <button id="show-chat-button" class="mobile-button" type="button">对话</button>
            </div>
            <div id="center-tabs" class="center-tabs" role="tablist" aria-label="已打开文件"></div>
          </div>
          <div class="center-meta-bar">
            <div class="center-title-group">
              <p class="eyebrow">工作区</p>
              <h2 id="center-title">选择文件或技能</h2>
              <p id="center-subtitle" class="panel-summary">使用左侧面板打开文件、查看技能，或创建新的工作台。</p>
            </div>
            <div class="center-actions">
              <button id="add-file-context-button" class="center-icon-button hidden" type="button" aria-label="加入上下文" title="加入上下文"></button>
              <button id="markdown-toggle-button" class="center-icon-button hidden" type="button" aria-label="切换 Markdown 视图" title="切换 Markdown 视图"></button>
              <button id="persist-file-button" class="center-icon-button hidden" type="button" aria-label="保存临时文件到永久文件" title="保存临时文件到永久文件"></button>
              <button id="save-file-button" class="center-icon-button hidden" type="button" aria-label="保存文件" title="保存文件"></button>
            </div>
          </div>
        </header>

        <section id="center-view" class="center-view" aria-live="polite"></section>
      </main>

      <div
        id="divider-right"
        class="panel-divider panel-divider-right"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整文档和对话面板大小"
      ></div>

      <section class="chat-panel">
        <header class="panel-header chat-header">
          <div class="chat-title-group">
            <button id="show-center-button" class="mobile-button" type="button">返回</button>
            <span class="ai-agent-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M12 3v3"></path>
                <path d="M8 6h8a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-5a4 4 0 0 1 4-4Z"></path>
                <path d="M7 13v-2"></path>
                <path d="M17 13v-2"></path>
                <path d="M9.5 16h5"></path>
                <path d="M12 3.5h.01"></path>
              </svg>
            </span>
            <div>
              <p class="eyebrow">助手</p>
              <h3 id="chat-title">AI 助手</h3>
              <p id="chat-subtitle" class="panel-summary">助手会优先关注当前文件，并在需要时扩展到整个工作区。</p>
              <div id="agent-trace-controls" class="agent-trace-controls" aria-label="智能体轨迹控制"></div>
            </div>
          </div>
          <div class="chat-header-meta">
            <div class="session-history-container">
              <button id="session-history-button" class="ghost-icon-button" type="button" aria-label="显示会话历史" title="会话历史" aria-expanded="false" aria-controls="session-history-popover">
                <svg class="session-history-icon" aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                  <path d="M3 4v5h5"></path>
                  <path d="M12 7v5l3 2"></path>
                </svg>
              </button>
              <div id="session-history-popover" class="session-history-popover hidden" role="menu" aria-label="会话历史"></div>
            </div>
            <button id="new-session-button" class="ghost-icon-button" type="button" aria-label="新建会话" title="新建会话">+</button>
            <span id="session-status" class="session-status">空闲</span>
          </div>
        </header>

        <section id="messages" class="messages"></section>

        <form id="composer" class="composer">
          <div class="composer-shell">
            <div id="context-chips" class="context-chips"></div>
            <div id="pending-mentions" class="pending-mentions" aria-live="polite"></div>
            <div class="composer-row">
              <label for="message-input" class="sr-only">消息</label>
              <textarea id="message-input" rows="3" placeholder="询问当前文件、工作区，或当前研究方向"></textarea>
              <div class="composer-bottom-bar">
                <div class="composer-toolbar">
                  <button id="add-skill-button" class="composer-tool-button" type="button" aria-label="添加技能" title="添加技能">$ 技能</button>
                  <button id="add-sources-button" class="composer-tool-button" type="button" aria-label="添加来源" title="添加来源">@ 来源</button>
                  <button id="agent-effort-button" class="composer-tool-button effort-button hidden" type="button" aria-label="选择智能体投入强度" title="选择智能体投入强度">
                    <span class="effort-button-label">强度</span>
                    <span class="effort-button-divider" aria-hidden="true"></span>
                    <span class="effort-button-value">中</span>
                  </button>
                </div>
                <button id="send-button" class="primary-button action-button" type="submit" aria-label="发送消息">
                  <span class="action-button-icon send-icon" aria-hidden="true">
                    <svg viewBox="0 0 20 20" focusable="false">
                      <path d="M16.79 3.21a1 1 0 0 0-1.02-.24L3.77 7.42a1 1 0 0 0 .08 1.91l5.12 1.54 1.54 5.12a1 1 0 0 0 1.91.08l4.45-12a1 1 0 0 0-.08-.86Z"></path>
                    </svg>
                  </span>
                  <span class="action-button-icon stop-icon hidden" aria-hidden="true">
                    <svg viewBox="0 0 20 20" focusable="false">
                      <rect x="4.5" y="4.5" width="11" height="11" rx="2.2"></rect>
                    </svg>
                  </span>
                  <span id="send-button-text" class="sr-only">发送</span>
                </button>
              </div>
            </div>
            <div id="mention-menu" class="mention-menu hidden" role="listbox" aria-label="输入框提及菜单"></div>
          </div>
        </form>
        <div id="context-status-bar" class="context-status-bar" aria-live="polite">
          <div class="context-status-track" aria-hidden="true">
            <span id="context-status-fill" class="context-status-fill"></span>
          </div>
          <span id="context-status-text" class="context-status-text">上下文等待首次模型调用</span>
        </div>
      </section>
    </div>

    <template id="message-template">
      <article class="message-card">
        <div class="message-meta">
          <span class="message-role"></span>
          <span class="message-time"></span>
        </div>
        <div class="message-body"></div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js" defer></script>
    <script src="/static/js/core.js" defer></script>
    <script src="/static/js/layout.js" defer></script>
    <script src="/static/js/workspace.js" defer></script>
    <script src="/static/js/center.js" defer></script>
    <script src="/static/js/composer_state.js" defer></script>
    <script src="/static/js/chat_trace.js" defer></script>
    <script src="/static/js/composer_mentions.js" defer></script>
    <script src="/static/js/bootstrap.js" defer></script>
  </body>
</html>
