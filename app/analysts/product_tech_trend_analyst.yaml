analyst_id: product_tech_trend_analyst
name: 产品技术趋势研究分析师
description: 对某产品所处的技术领域进行系统性趋势研究。
default_query: 请对某产品所处的技术领域进行系统性趋势研究
skill_id: tech_trend_skill
methodology_config: app/config/analysis_directions/product_tech_trend_research.yaml
data_sources:
  - type: elasticsearch
    env:
      url: ES_URL
      index: ES_INDEX
workflow_order:
  - analyst_loader
  - research_router
  - task_plan_builder
  - query_rewriter
  - retrieval
  - instruction_selector
  - reflection_agent
  - skill_executor
  - synthesis
  - citation_checker
default_route: tech_trend_skill
reflection:
  enabled: true
  max_iterations: 3
  max_entities_per_iteration: 4
  min_new_docs_per_iteration: 1
  target_evidence_coverage: 0.75
  retrieval_size_per_entity: 3
skills:
  tech_trend_skill:
    name: 技术趋势研究
    description: 对某产品所处技术领域进行系统性趋势研究，覆盖技术演进、驱动因素、机会和风险。
    triggers:
      - 技术趋势
      - 技术路线
      - 技术领域
      - 趋势研究
      - 路线图
    modules:
      - G4
      - G12
      - G96
    required_evidence:
      - product_launch
      - supply_signal
      - competitor_signal
      - technical_innovation_signal
